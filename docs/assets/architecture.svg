<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">jev-mem architecture</title>
  <desc id="desc">Decision input flows to local semantic embeddings and one hundred attribute fingerprints produced by the Jev API or local Laya-MLX, then stored in Git Markdown and indexed in SQLite for hybrid analogical search. Heatmaps are visualization only.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <style>
      .label{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.body{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}.small{font:12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="#f8fafc"/>
  <rect x="34" y="30" width="1132" height="66" rx="16" fill="url(#head)"/>
  <text x="70" y="70" class="label white" font-size="23">Decision analogical search pipeline</text>
  <text x="1130" y="69" text-anchor="end" class="mono white">semantic + 100 attributes</text>

  <g filter="url(#shadow)">
    <rect x="62" y="146" width="236" height="194" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="184" class="label">CLI / MCP client</text>
    <text x="92" y="218" class="mono">save_decision</text>
    <text x="92" y="242" class="mono">search_analogies</text>
    <line x1="92" y1="264" x2="268" y2="264" stroke="#e2e8f0"/>
    <text x="92" y="291" class="body">Decision · Rationale</text>
    <text x="92" y="316" class="body">Evidence · Context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="124" width="420" height="250" rx="22" fill="#fff" stroke="#94a3b8"/>
    <text x="426" y="164" class="label">jev-mem</text>
    <rect x="426" y="190" width="156" height="64" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="446" y="216" class="mono">Security gate</text>
    <text x="446" y="237" class="small">reject secrets / PII</text>
    <rect x="610" y="190" width="156" height="64" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="630" y="216" class="mono">Decision frame</text>
    <text x="630" y="237" class="small">fix evaluation target</text>
    <rect x="426" y="278" width="156" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="446" y="304" class="mono">Git workflow</text>
    <text x="446" y="325" class="small">pull · commit · push</text>
    <rect x="610" y="278" width="156" height="64" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="630" y="304" class="mono">JSON response</text>
    <text x="630" y="325" class="small">scores + warnings</text>
  </g>

  <path d="M298 242h72" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="884" y="112" width="252" height="122" rx="18" fill="#fff" stroke="#67e8f9"/>
    <text x="918" y="151" class="label">Local ONNX</text>
    <text x="918" y="179" class="body">multilingual-e5-small</text>
    <text x="918" y="204" class="mono">semantic vector · 384d</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="884" y="264" width="252" height="122" rx="18" fill="#fff" stroke="#c4b5fd"/>
    <text x="918" y="303" class="label">Jev API / Laya-MLX</text>
    <text x="918" y="331" class="body">cloud or local · schema v1</text>
    <text x="918" y="356" class="mono">100-attribute fingerprint</text>
  </g>
  <path d="M806 192c35-24 43-25 62-25" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M806 302c35 20 43 21 62 21" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="64" y="474" width="286" height="170" rx="18" fill="#fff" stroke="#0f766e"/>
    <text x="98" y="516" class="label">Git Markdown</text>
    <text x="98" y="547" class="body">source of truth</text>
    <text x="98" y="577" class="mono">human-readable decision</text>
    <text x="98" y="601" class="mono">embedded fingerprint JSON</text>
    <text x="98" y="625" class="small">history · diffs · rebuild</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="458" y="474" width="286" height="170" rx="18" fill="#fff" stroke="#2563eb"/>
    <text x="492" y="516" class="label">SQLite index</text>
    <text x="492" y="547" class="body">local rebuildable cache</text>
    <text x="492" y="577" class="mono">semantic embeddings</text>
    <text x="492" y="601" class="mono">fingerprint values</text>
    <text x="492" y="625" class="small">metadata · status · scores</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="852" y="474" width="286" height="170" rx="18" fill="#fff" stroke="#a78bfa"/>
    <text x="886" y="516" class="label">Hybrid ranking</text>
    <text x="886" y="547" class="mono">0.35 × semantic</text>
    <text x="886" y="573" class="mono">0.65 × fingerprint*</text>
    <text x="886" y="602" class="small">* coverage + confidence adjusted</text>
    <text x="886" y="626" class="small">layer explanations included</text>
  </g>

  <path d="M514 374c-87 44-151 74-214 91" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M655 374c-13 46-22 68-34 84" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M744 559h92" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M350 559h92" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="383" y="543" class="small">resync</text>

  <g>
    <rect x="232" y="710" width="736" height="74" rx="15" fill="#0f172a"/>
    <text x="272" y="741" class="label white">10×10 heatmap</text>
    <text x="272" y="765" class="body" fill="#cbd5e1">The same attribute values are rendered for humans.&#160;Pixels are never used for search.</text>
    <g transform="translate(842 726)">
      <rect width="18" height="18" rx="3" fill="#164e63"/><rect x="23" width="18" height="18" rx="3" fill="#0891b2"/><rect x="46" width="18" height="18" rx="3" fill="#7c3aed"/><rect x="69" width="18" height="18" rx="3" fill="#a78bfa"/>
      <rect y="23" width="18" height="18" rx="3" fill="#334155"/><rect x="23" y="23" width="18" height="18" rx="3" fill="#155e75"/><rect x="46" y="23" width="18" height="18" rx="3" fill="#6d28d9"/><rect x="69" y="23" width="18" height="18" rx="3" fill="#8b5cf6"/>
    </g>
  </g>
  <path d="M995 644c-65 43-135 55-198 66" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
</svg>
